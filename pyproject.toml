[project]
name = "whatsapp-ai-chatbot"
version = "1.0.0"
description = "🤖 Chatbot inteligente para WhatsApp com IA (FastAPI + Gemini / OpenAI) para automação de atendimento, FAQ e vendas."
readme = "README.md"
authors = [
    { name = "Luan Rocha da Silva", email = "luanroccha13@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
